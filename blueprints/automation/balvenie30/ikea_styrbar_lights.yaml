blueprint:
  name: IKEA STYRBAR - Light actions (ZHA)
  description: |
    Run custom actions from an IKEA STYRBAR remote connected through ZHA.

    Each button has a short-press and long-press action selector. If Force
    brightness is enabled, the selected lights are set to the configured
    brightness immediately before a non-empty button action runs. This makes
    turn-on and toggle-on actions use the configured brightness; with the
    option disabled, the action uses Home Assistant's normal behavior.

    Short presses wait briefly so STYRBAR's initial press event is cancelled
    when a long press event arrives.
  domain: automation
  input:
    remote:
      name: Remote
      description: IKEA STYRBAR remote to use.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: IKEA of Sweden
              model: Remote Control N2

    light:
      name: Light(s)
      description: Lights to set when Force brightness is enabled.
      selector:
        target:
          entity:
            domain: light

    force_brightness:
      name: Force brightness
      description: Set the selected lights to Brightness before a configured action.
      default: false
      selector:
        boolean: {}

    brightness:
      name: Brightness
      description: Brightness used when Force brightness is enabled.
      default: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: slider
          unit_of_measurement: "%"

    button_up_short:
      name: Up button - short press
      description: Actions to run on a short Up-button press.
      default: []
      selector:
        action: {}

    button_up_long:
      name: Up button - long press
      description: Action to run on a long Up-button press.
      default: []
      selector:
        action: {}

    button_down_short:
      name: Down button - short press
      description: Actions to run on a short Down-button press.
      default: []
      selector:
        action: {}

    button_down_long:
      name: Down button - long press
      description: Actions to run on a long Down-button press.
      default: []
      selector:
        action: {}

    button_left_short:
      name: Left button - short press
      description: Action to run on a short Left-button press.
      default: []
      selector:
        action: {}

    button_left_long:
      name: Left button - long press
      description: Action to run on a long Left-button press.
      default: []
      selector:
        action: {}

    button_right_short:
      name: Right button - short press
      description: Action to run on a short Right-button press.
      default: []
      selector:
        action: {}

    button_right_long:
      name: Right button - long press
      description: Action to run on a long Right-button press.
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

variables:
  force_brightness: !input force_brightness
  brightness: !input brightness

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      command: "{{ trigger.event.data.command }}"
      cluster_id: "{{ trigger.event.data.cluster_id | int(0) }}"
      endpoint_id: "{{ trigger.event.data.endpoint_id | int(0) }}"
      args: "{{ trigger.event.data.args | default([]) }}"

  - choose:
      # shortcut: action selectors cannot be introspected; force brightness is
      # therefore applied before each non-empty configured action sequence.
      # Up button, short press. mode: restart cancels this run on hold.
      - conditions:
          - condition: template
            value_template: "{{ command == 'on' and cluster_id == 6 and endpoint_id == 1 }}"
        sequence:
          - delay:
              milliseconds: 300
          - variables:
              button_action: !input button_up_short
          - if:
              - condition: template
                value_template: "{{ force_brightness and button_action | length > 0 }}"
            then:
              - action: light.turn_on
                target: !input light
                data:
                  brightness_pct: !input brightness
          - sequence: !input button_up_short

      # Up button, long press.
      - conditions:
          - condition: template
            value_template: "{{ command == 'move_with_on_off' and cluster_id == 8 and endpoint_id == 1 }}"
        sequence:
          - variables:
              button_action: !input button_up_long
          - if:
              - condition: template
                value_template: "{{ force_brightness and button_action | length > 0 }}"
            then:
              - action: light.turn_on
                target: !input light
                data:
                  brightness_pct: !input brightness
          - sequence: !input button_up_long

      # Down button, short press. mode: restart cancels this run on hold.
      - conditions:
          - condition: template
            value_template: "{{ command == 'off' and cluster_id == 6 and endpoint_id == 1 }}"
        sequence:
          - delay:
              milliseconds: 300
          - variables:
              button_action: !input button_down_short
          - if:
              - condition: template
                value_template: "{{ force_brightness and button_action | length > 0 }}"
            then:
              - action: light.turn_on
                target: !input light
                data:
                  brightness_pct: !input brightness
          - sequence: !input button_down_short

      # Down button, long press.
      - conditions:
          - condition: template
            value_template: "{{ command == 'move' and cluster_id == 8 and endpoint_id == 1 }}"
        sequence:
          - variables:
              button_action: !input button_down_long
          - if:
              - condition: template
                value_template: "{{ force_brightness and button_action | length > 0 }}"
            then:
              - action: light.turn_on
                target: !input light
                data:
                  brightness_pct: !input brightness
          - sequence: !input button_down_long

      # Left button, short press. mode: restart cancels this run on hold.
      - conditions:
          - condition: template
            value_template: "{{ command == 'press' and cluster_id == 5 and endpoint_id == 1 and args == [257, 13, 0] }}"
        sequence:
          - delay:
              milliseconds: 300
          - variables:
              button_action: !input button_left_short
          - if:
              - condition: template
                value_template: "{{ force_brightness and button_action | length > 0 }}"
            then:
              - action: light.turn_on
                target: !input light
                data:
                  brightness_pct: !input brightness
          - sequence: !input button_left_short

      # Left button, long press.
      - conditions:
          - condition: template
            value_template: "{{ command == 'hold' and cluster_id == 5 and endpoint_id == 1 and args == [3329, 0] }}"
        sequence:
          - variables:
              button_action: !input button_left_long
          - if:
              - condition: template
                value_template: "{{ force_brightness and button_action | length > 0 }}"
            then:
              - action: light.turn_on
                target: !input light
                data:
                  brightness_pct: !input brightness
          - sequence: !input button_left_long

      # Right button, short press. mode: restart cancels this run on hold.
      - conditions:
          - condition: template
            value_template: "{{ command == 'press' and cluster_id == 5 and endpoint_id == 1 and args == [256, 13, 0] }}"
        sequence:
          - delay:
              milliseconds: 300
          - variables:
              button_action: !input button_right_short
          - if:
              - condition: template
                value_template: "{{ force_brightness and button_action | length > 0 }}"
            then:
              - action: light.turn_on
                target: !input light
                data:
                  brightness_pct: !input brightness
          - sequence: !input button_right_short

      # Right button, long press.
      - conditions:
          - condition: template
            value_template: "{{ command == 'hold' and cluster_id == 5 and endpoint_id == 1 and args == [3328, 0] }}"
        sequence:
          - variables:
              button_action: !input button_right_long
          - if:
              - condition: template
                value_template: "{{ force_brightness and button_action | length > 0 }}"
            then:
              - action: light.turn_on
                target: !input light
                data:
                  brightness_pct: !input brightness
          - sequence: !input button_right_long
